[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wp-draft-uploader"
version = "1.0.0"
description = "Independent immutable-bundle WordPress draft uploader"
requires-python = ">=3.12,<3.15"
dependencies = [
 "httpx==0.28.1", "pydantic==2.13.5",
 "beautifulsoup4==4.14.3", "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.3"]

[project.scripts]
wpuploader = "wpuploader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["wpuploader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
